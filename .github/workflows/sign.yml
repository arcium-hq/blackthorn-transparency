name: Sign

# Signs every policies/<digest>/statement.json that has no bundle yet, with a
# short-lived Sigstore certificate for this workflow's identity, into Sigstore's
# public transparency log (Rekor), and commits the bundle next to it:
#   identity  https://github.com/arcium-hq/blackthorn-transparency/.github/workflows/sign.yml@refs/heads/main
#   issuer    https://token.actions.githubusercontent.com
# signing-config.json picks Rekor v1 (rekor.sigstore.dev), whose signed entry
# timestamp a verifier checks offline.
on:
  push:
    branches: [main]
    paths: ["policies/*/statement.json"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: sign
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: v3.1.5
      - name: Sign new statements
        run: |
          set -euo pipefail
          signed=()
          for statement in policies/*/statement.json; do
            bundle="${statement%.json}.sigstore.json"
            [ -e "$bundle" ] && continue
            cosign sign-blob --yes --signing-config signing-config.json --bundle "$bundle" "$statement"
            cosign verify-blob "$statement" --bundle "$bundle" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/sign.yml@refs/heads/main" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
            signed+=("$(basename "$(dirname "$statement")")")
          done
          [ ${#signed[@]} -gt 0 ] || { echo "nothing to sign"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add policies
          git commit -m "Sign ${signed[*]}"
          git push
